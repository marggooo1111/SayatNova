<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SAYAT-NOVA — The Legend of the Caucasus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Serif+Armenian:wght@400;700&display=swap">
<style>
:root{--ink:#f3e6c8;--gold:#c9a24b;--wine:#5a1620;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#120708;color:var(--ink);font-family:"Cormorant Garamond","Noto Serif Armenian",Georgia,serif;font-size:18px}
body.nogl{background:radial-gradient(circle at 50% 40%,#5a1620,#120708 70%)}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:3;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:linear-gradient(#120708f0,#12070800)}
header button,#halls button,#go{font:inherit;color:var(--ink);background:#2a0d12cc;border:1px solid #c9a24b66;border-radius:6px;padding:5px 9px;cursor:pointer;pointer-events:auto}
header button.on,#halls button.on{background:var(--wine);border-color:var(--gold)}
#lang{margin-left:auto;display:flex;gap:4px}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:2;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;max-width:640px;background:linear-gradient(#12070800,#120708e6 35%)}
#panel *{pointer-events:auto}
h1{font-size:clamp(36px,10vw,64px);letter-spacing:.12em;margin:0;color:var(--gold);text-shadow:0 4px 18px #000}
h2{margin:0 0 6px;color:var(--gold);font-size:30px}h3{margin:6px 0;font-weight:500;opacity:.85}
p{line-height:1.45;margin:6px 0}small{opacity:.6;display:block;margin-top:8px;font-size:13px}
#go{background:var(--wine);margin-top:8px;font-size:18px;letter-spacing:.1em;padding:10px 18px}
#halls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
</style></head><body>
<canvas id="c"></canvas><header id="nav"></header><div id="panel"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),PG=['home','bio','life','poetry','music','era','museum'];
const L={
ru:{n:['Главная','Биография','Личная жизнь','Поэзия','Музыка','Эпоха','Музей'],k:'«Искусство, пережившее века»',s:'Жизнь, любовь, поэзия и музыка великого армянского ашуга.',b:'ОТКРЫТЬ МУЗЕЙ',
p:['Арутин Саядян (ок. 1712 — 1795), известный как Саят-Нова — армянский ашуг, поэт и музыкант Тифлиса XVIII века. Он писал на армянском, грузинском и азербайджанском языках.',
'По традиционной версии, родился в Тифлисе около 1712 года; точные место и год обсуждаются. Был придворным ашугом при Ираклии II, около 1759 года принял сан священника и, по преданию, погиб в монастыре Ахпат в 1795 году при вторжении Ага-Мохаммед-хана.',
'По сохранившимся сведениям, у него была семья. Легенда о любви к царевне — позднее предание без прямых документальных подтверждений; мы не выдаём её за факт.',
'Сохранилось около 220 песен, значительная часть — на азербайджанском. Тексты и названия будут добавлены только после сверки с академическими изданиями.',
'Ашуг сам сочиняет и исполняет песни. Каманча — смычковый струнный инструмент; потяните сцену, чтобы повернуть её.',
'Тифлис XVIII века — многоязычный город Картли-Кахетинского царства. Фильм Сергея Параджанова «Цвет граната» (1969) — художественная интерпретация, а не биография.',
'Шесть залов. Выберите зал, чтобы подойти к экспонату.'],
h:['Детство и происхождение','Тифлис XVIII века','Личная жизнь и легенды','Поэтическое наследие','Музыкальный мир','Последние годы и память'],
f:'Общие справки: Encyclopaedia Britannica; Армянская советская энциклопедия. Полный список источников — в разработке.'},
en:{n:['Home','Biography','Personal life','Poetry','Music','Era','Museum'],k:'“Art that outlived the centuries”',s:'The life, love, poetry and music of the great Armenian ashugh.',b:'OPEN THE MUSEUM',
p:['Harutyun Sayadyan (c. 1712–1795), known as Sayat-Nova, was an Armenian ashugh, poet and musician of 18th-century Tiflis. He wrote in Armenian, Georgian and Azerbaijani.',
'Traditionally said to be born in Tiflis around 1712; the exact place and year are debated. He served as court ashugh under Erekle II, became a priest around 1759 and, by tradition, was killed at Haghpat monastery in 1795 during Agha Mohammad Khan’s invasion.',
'Sources indicate he had a family. The legend of his love for a princess is a later tradition without direct documentary proof; we do not present it as fact.',
'About 220 songs survive, many in Azerbaijani. Texts and titles will be added only after checking against academic editions.',
'An ashugh composes and performs his own songs. The kamancha is a bowed string instrument; drag the scene to rotate it.',
'18th-century Tiflis was a multilingual city of the Kingdom of Kartli-Kakheti. Sergei Parajanov’s film The Color of Pomegranates (1969) is an artistic interpretation, not a biography.',
'Six halls. Pick a hall to approach its exhibit.'],
h:['Childhood and origins','Tiflis in the 18th century','Personal life and legends','Poetic legacy','The musical world','Last years and memory'],
f:'General references: Encyclopaedia Britannica; Armenian Soviet Encyclopedia. Full source list in progress.'},
hy:{n:['Գլխավոր','Կենսագրություն','Անձնական կյանք','Պոեզիա','Երաժշտություն','Դարաշրջան','Թանգարան'],k:'«Արվեստ, որ դարեր հաղթահարեց»',s:'Մեծ հայ աշուղի կյանքը, սերը, պոեզիան և երաժշտությունը։',b:'ԲԱՑԵԼ ԹԱՆԳԱՐԱՆԸ',
p:['Սայաթ-Նովան (Հարություն Սայադյան, մոտ 1712–1795)՝ XVIII դարի հայ աշուղ, բանաստեղծ և երաժիշտ։ Գրել է հայերեն, վրացերեն և ադրբեջաներեն։',
'Ըստ ավանդական տեսակետի՝ ծնվել է Թիֆլիսում, մոտ 1712-ին. ծննդյան վայրն ու տարեթիվը քննարկվում են։ Եղել է Հերակլ II-ի արքունիքի աշուղը, մոտ 1759-ին քահանա է դարձել, իսկ ըստ ավանդության՝ զոհվել է Հաղպատում 1795-ին։',
'Պահպանված տեղեկությունների համաձայն՝ ունեցել է ընտանիք։ Արքայադստեր հանդեպ սիրո պատմությունը ուշ ավանդություն է. վավերագրական հաստատում չկա։',
'Պահպանվել է շուրջ 220 երգ. զգալի մասը՝ ադրբեջաներեն։ Տեքստերն ու վերնագրերը կավելացվեն միայն ակադեմիական հրատարակություններից ստուգելուց հետո։',
'Աշուղը ինքն է հորինում և կատարում երգերը։ Քամանչան աղեղնավոր լարային գործիք է. քաշեք տեսարանը՝ պտտելու համար։',
'XVIII դարի Թիֆլիսը Քարթլի-Կախեթի թագավորության բազմալեզու քաղաքն էր։ Սերգեյ Փարաջանովի «Նռան գույնը» (1969) գեղարվեստական մեկնաբանություն է, ոչ կենսագրություն։',
'Վեց սրահ։ Ընտրեք սրահը՝ ցուցանմուշին մոտենալու համար։'],
h:['Մանկություն և ծագում','Թիֆլիսը XVIII դարում','Անձնական կյանք և ավանդություններ','Բանաստեղծական ժառանգություն','Երաժշտական աշխարհ','Վերջին տարիներ և հիշողություն'],
f:'Ընդհանուր աղբյուրներ՝ Encyclopaedia Britannica, Հայկական սովետական հանրագիտարան։ Ամբողջական ցանկը մշակման փուլում է։'}};
let lang='ru',page='home',hall=0,ry=0;
const tp=new THREE.Vector3(0,1.8,9),tl=new THREE.Vector3(0,1.2,0);
function aim(){const i=PG.indexOf(page);
 if(page==='museum'){const x=40+hall*6;tp.set(x,1.6,4.5);tl.set(x,1.2,0)}
 else if(page==='music'){tp.set(.6,1.3,1.8);tl.set(0,1,.4)}
 else{const a=(i-1)*.45,d=page==='home'?3.6:5;tp.set(Math.sin(a)*d,1.6,Math.cos(a)*d);tl.set(0,1.2,0)}}
function render(){const d=L[lang],i=PG.indexOf(page);
 $('#nav').innerHTML=d.n.map((t,j)=>`<button data-p="${PG[j]}" class="${j===i?'on':''}">${t}</button>`).join('')+'<div id="lang">'+['ru','hy','en'].map(l=>`<button data-l="${l}" class="${l===lang?'on':''}">${l.toUpperCase()}</button>`).join('')+'</div>';
 let h=page==='home'?`<h1>SAYAT-NOVA</h1><h3><em>${d.k}</em></h3><p>${d.s}</p><p>${d.p[0]}</p><button id="go">${d.b}</button>`:`<h2>${d.n[i]}</h2><p>${d.p[i]}</p>`;
 if(page==='museum')h+=`<div id="halls">${d.h.map((t,j)=>`<button data-h="${j}" class="${j===hall?'on':''}">${j+1}. ${t}</button>`).join('')}</div>`;
 $('#panel').innerHTML=h+`<small>${d.f}</small>`;document.documentElement.lang=lang==='hy'?'hy':lang}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.p)location.hash=b.dataset.p;if(b.id==='go')location.hash='museum';
 if(b.dataset.l){lang=b.dataset.l;render()}if(b.dataset.h){hall=+b.dataset.h;aim();render()}});
function route(){const h=location.hash.slice(1);page=PG.includes(h)?h:'home';aim();render()}
addEventListener('hashchange',route);route();
let R;try{R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true})}catch(e){document.body.classList.add('nogl')}
if(R){
 R.setPixelRatio(Math.min(devicePixelRatio,2));
 const S=new THREE.Scene();S.background=new THREE.Color(0x120708);S.fog=new THREE.Fog(0x120708,8,45);
 const cam=new THREE.PerspectiveCamera(50,1,.1,100);cam.position.set(0,1.8,9);
 const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
 const add=(g,m,x,y,z,p=S)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o};
 S.add(new THREE.AmbientLight(0x6a4a3a,.7));
 const lamps=[[-2.5,2.2,-1.5],[2.8,2,-2],[0,2.8,-5]].map(p=>{const l=new THREE.PointLight(0xffb45a,1.4,12);l.position.set(...p);S.add(l);add(new THREE.SphereGeometry(.12,12,12),M(0xffd080,{emissive:0xffa030,emissiveIntensity:2}),...p);return l});
 add(new THREE.CircleGeometry(14,48),M(0x3a2216),0,0,0).rotation.x=-Math.PI/2;
 for(let i=0;i<16;i++){const x=-15+i*2,h=2+Math.random()*3;add(new THREE.BoxGeometry(1.8,h,1.5),M(i%2?0x6b3a28:0x4a2a1e),x,h/2,-9-Math.random()*3);add(new THREE.BoxGeometry(.25,.4,.05),M(0xffd080,{emissive:0xffa030,emissiveIntensity:1.5}),x,h*.6,-8.2)}
 const fig=new THREE.Group();S.add(fig);
 add(new THREE.CylinderGeometry(.3,.62,1.1,20),M(0x6a1b28),0,.6,0,fig);
 add(new THREE.CylinderGeometry(.33,.33,.35,20),M(0xb08a3c,{metalness:.4}),0,1.05,0,fig);
 add(new THREE.SphereGeometry(.2,20,20),M(0xd8a67a),0,1.55,0,fig);
 add(new THREE.CylinderGeometry(.19,.24,.3,20),M(0x1a0d0d),0,1.83,0,fig);
 const kam=new THREE.Group();kam.position.set(-.05,.85,.5);fig.add(kam);
 add(new THREE.SphereGeometry(.17,20,20),M(0x8a5a2a),0,0,0,kam).scale.set(1,1.1,.9);
 add(new THREE.CylinderGeometry(.025,.03,.85,10),M(0x2a1608),0,.5,0,kam);
 add(new THREE.BoxGeometry(.1,.14,.06),M(0x2a1608),0,.98,0,kam);
 const strs=[-.02,0,.02].map(x=>add(new THREE.CylinderGeometry(.004,.004,.8,6),M(0xe8d7a0),x,.5,.17,kam));
 const bow=add(new THREE.CylinderGeometry(.008,.008,.7,6),M(0xd8c9a8),0,.3,.2,kam);bow.rotation.z=Math.PI/2;
 add(new THREE.SphereGeometry(.05,10,10),M(0xd8a67a),0,.6,.2,kam);
 const arm=new THREE.Group();arm.position.set(.36,1.3,.1);fig.add(arm);
 add(new THREE.CylinderGeometry(.06,.05,.95,10),M(0x6a1b28),0,-.47,0,arm);
 const dust=new THREE.BufferGeometry(),N=350,pa=new Float32Array(N*3);for(let i=0;i<N*3;i++)pa[i]=(Math.random()-.5)*(i%3===1?5:12);
 dust.setAttribute('position',new THREE.BufferAttribute(pa,3));S.add(new THREE.Points(dust,new THREE.PointsMaterial({color:0xffd9a0,size:.03,transparent:true,opacity:.7})));
 const items=[new THREE.SphereGeometry(.3,16,16),new THREE.ConeGeometry(.3,.6,16),new THREE.BoxGeometry(.5,.35,.5),new THREE.TorusGeometry(.25,.07,12,24),new THREE.CylinderGeometry(.2,.2,.6,16),new THREE.OctahedronGeometry(.3)];
 add(new THREE.PlaneGeometry(60,16),M(0x2a1410),55,0,0).rotation.x=-Math.PI/2;
 add(new THREE.BoxGeometry(60,5,.3),M(0x3a1a1a),55,2.5,-3);
 for(let i=0;i<6;i++){const x=40+i*6;
  add(new THREE.CylinderGeometry(.5,.6,.9,20),M(0x6b4423),x,.45,0);
  add(items[i],M(0xc9a24b,{metalness:.7,roughness:.35}),x,1.25,0);
  add(new THREE.BoxGeometry(1.8,2.2,.1),M(0xc9a24b,{metalness:.6,roughness:.4}),x,2.2,-2.85);
  add(new THREE.PlaneGeometry(1.5,1.9),M(0x5a1620),x,2.2,-2.78);
  const l=new THREE.PointLight(0xffc070,1,9);l.position.set(x,3,1.5);S.add(l)}
 let dx=null;const cv=$('#c');
 cv.addEventListener('pointerdown',e=>dx=e.clientX);addEventListener('pointerup',()=>dx=null);
 addEventListener('pointermove',e=>{if(dx!==null&&page==='music'){ry+=(e.clientX-dx)*.012;dx=e.clientX}});
 const look=new THREE.Vector3(0,1.2,0);
 function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
 addEventListener('resize',size);size();
 (function loop(t){requestAnimationFrame(loop);t/=1000;
  lamps.forEach((l,i)=>l.intensity=1.3+Math.sin(t*7+i*2)*.25+Math.sin(t*13+i)*.1);
  strs.forEach((s,i)=>s.scale.x=1+Math.sin(t*70+i*2)*.8);
  bow.position.x=Math.sin(t*2.2)*.1;arm.rotation.z=-.4+Math.sin(t*2.2)*.15;arm.rotation.x=-.45;
  const p=dust.attributes.position;for(let i=0;i<N;i++){p.array[i*3+1]+=.0015;if(p.array[i*3+1]>2.8)p.array[i*3+1]=-.1}p.needsUpdate=true;
  if(page!=='music')ry*=.9;fig.rotation.y+=(ry-fig.rotation.y)*.1;
  cam.position.lerp(tp,.03);look.lerp(tl,.05);cam.lookAt(look);R.render(S,cam)})(0);
}
</script></body></html>
